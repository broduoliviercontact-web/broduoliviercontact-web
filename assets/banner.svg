<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Olivier Brodu — développeur web full-stack</title>
  <desc id="desc">Développeur créatif spécialisé dans les projets web, audio, MIDI et hardware, en recherche d'alternance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0d1b2e"/>
      <stop offset="1" stop-color="#11263a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#20e3b2"/>
      <stop offset="1" stop-color="#22a7f0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="170" fill="#20e3b2" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1130" cy="300" r="145" fill="#22a7f0" opacity="0.09" filter="url(#glow)"/>
  <g opacity="0.28" stroke="url(#accent)" fill="none" stroke-width="2">
    <path d="M790 87h70l20 42h78l18 41h78l18 41h98"/>
    <path d="M790 273h66l24-43h76l22-42h76l22-42h74"/>
    <circle cx="790" cy="87" r="5" fill="#20e3b2"/>
    <circle cx="1150" cy="211" r="5" fill="#22a7f0"/>
    <circle cx="790" cy="273" r="5" fill="#20e3b2"/>
  </g>
  <rect x="66" y="58" width="174" height="34" rx="17" fill="#20e3b2" opacity="0.13" stroke="#20e3b2"/>
  <text x="153" y="80" fill="#73f2d2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="1.4">OPEN TO WORK</text>
  <text x="66" y="159" fill="#f4f8fb" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Olivier Brodu</text>
  <rect x="66" y="184" width="570" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="66" y="234" fill="#cad7e3" font-family="Arial, Helvetica, sans-serif" font-size="26">Développeur web full-stack · Creative technologist</text>
  <text x="66" y="282" fill="#8fa6bb" font-family="Arial, Helvetica, sans-serif" font-size="20">React · TypeScript · Node.js · Supabase · Web Audio · MIDI</text>
  <text x="66" y="321" fill="#73f2d2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Recherche une alternance — Paris / Pantin / hybride</text>
</svg>
